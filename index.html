      modal.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true"><div class="modal-header"><h2>${editing?'✏️ Editar despesa':'➕ Nova despesa'}</h2><button type="button" class="icon-button" id="finClose">✕</button></div>
        <div class="field"><label>Data</label><input type="date" id="finDateInput" value="${editing?localDateKey(finDate(row)):finToday()}" required></div>
        <div class="field"><label>Descrição</label><input type="text" id="finDescription" value="${escapeHtml(editing?finField(row,['DESCRICAO','descricao'],''):'')}" required></div>
        <div class="field"><label>Categoria</label><select id="finCategory"><option value="">Selecione</option>${finOptions(financeiroState.categorias,category,['NOME','nome'])}</select></div>
        <div class="field"><label>Forma de pagamento</label><select id="finPayment"><option value="">Selecione</option>${finOptions(financeiroState.formas,payment,['NOME','nome','DESCRICAO','descricao'])}</select></div>
        <div class="field"><label>Valor</label><input type="number" step="0.01" min="0.01" id="finAmount" value="${editing?finValue(row):''}" required></div>
        <div class="field"><label>Observação</label><textarea id="finObservation">${escapeHtml(editing?finField(row,['OBSERVACAO','observacao'],''):'')}</textarea></div>
        <div class="actions-inline" style="justify-content:flex-end;margin-top:18px"><button type="button" class="secondary-button" id="finCancel">Cancelar</button><button type="button" class="primary-button" id="finSave">💾 ${editing?'Salvar alterações':'Cadastrar despesa'}</button></div></div>`;
      document.body.appendChild(modal);
      const close=()=>{ modal.remove(); document.body.classList.remove('modal-open'); };
      modal.querySelector('#finClose').addEventListener('click',close);
      modal.querySelector('#finCancel').addEventListener('click',close);
      modal.addEventListener('click',(event)=>{ if(event.target===modal) close(); });
      modal.querySelector('#finSave').addEventListener('click',async()=>{
        const button=modal.querySelector('#finSave');
        try {
          const payload=finPayload(row);
          if(!confirm(editing?'Confirmar alteração desta despesa?':'Confirmar inclusão desta nova despesa?')) return;
          button.disabled=true; button.textContent='Salvando...';
          if(editing) await finUpdate(row,payload); else await finInsert(payload);
          close();
          showToast('Sucesso',editing?'Despesa alterada com sucesso.':'Despesa cadastrada com sucesso.');
          renderFinanceiroModule();
        } catch(e) {
          console.error('FINANCEIRO SAVE:',e);
          showToast(editing?'Erro ao editar':'Erro ao cadastrar',e.message||'Não foi possível salvar.');
          button.disabled=false; button.textContent=editing?'💾 Salvar alterações':'💾 Cadastrar despesa';
        }
      });
    }

    function finPayload(row) {
      const date=document.getElementById('finDateInput').value;
      const description=document.getElementById('finDescription').value.trim();
      const categoryId=document.getElementById('finCategory').value||null;
      const paymentId=document.getElementById('finPayment').value||null;
      const amount=Number(document.getElementById('finAmount').value);
      const observation=document.getElementById('finObservation').value.trim()||null;
      if(!date||!description||!(amount>0)) throw new Error('Informe data, descrição e valor válido.');

      // A estrutura real da FINANCEIRO_DESPESAS não possui CATEGORIA nem
      // FORMA_PAGAMENTO. Ela guarda os relacionamentos por *_ID.
      // Mantemos os nomes reais das demais colunas conforme o registro existente.
      const sample=row||financeiroState.despesas[0]||{};
      const put=(obj,candidates,value,fallback)=>{obj[finColumnName(sample,candidates,fallback)]=value;};
      const payload={};
      put(payload,['DATA','data'],date+'T12:00:00','DATA');
      put(payload,['DESCRICAO','descricao'],description,'DESCRICAO');
      put(payload,['CATEGORIA_ID','categoria_id'],categoryId,'CATEGORIA_ID');
      put(payload,['FORMA_PAGAMENTO_ID','forma_pagamento_id'],paymentId,'FORMA_PAGAMENTO_ID');
      put(payload,['VALOR','valor'],amount,'VALOR');
      // OBSERVACAO só é enviado se a coluna existir; assim evitamos erro de schema.
      const obsField=finColumnName(sample,['OBSERVACAO','observacao'],null);
      if(obsField) payload[obsField]=observation;
      return payload;
    }

    async function finInsert(payload) {
      const result=await restRequest(financeiroState.tabelaDespesas,'',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
      if(!Array.isArray(result)||result.length<1) throw new Error('O Supabase não retornou o novo lançamento.');
      return result[0];
    }

    async function finUpdate(row,payload) {
      const id=finId(row); if(!id) throw new Error('ID do lançamento não encontrado.');
      const result=await restRequest(financeiroState.tabelaDespesas,'?'+encodeURIComponent(id.field)+'=eq.'+encodeURIComponent(String(id.value)),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
      if(!Array.isArray(result)||result.length!==1) throw new Error('Nenhuma despesa foi atualizada. Nenhum novo registro foi criado.');
      return result[0];
    }

    async function finDelete(row) {
      const id=finId(row); if(!id) return showToast('Erro ao excluir','ID do lançamento não encontrado.');
      if(!confirm('Excluir esta despesa? Esta ação não poderá ser desfeita.')) return;
      try {
        await restRequest(financeiroState.tabelaDespesas,'?'+encodeURIComponent(id.field)+'=eq.'+encodeURIComponent(String(id.value)),{method:'DELETE',headers:{'Prefer':'return=representation'}});
        showToast('Despesa excluída','O lançamento foi removido.'); renderFinanceiroModule();
      } catch(e) { console.error('FINANCEIRO DELETE:',e); showToast('Erro ao excluir',e.message||'Não foi possível excluir a despesa.'); }
    }
    /* =====================================================
       MENU + HISTÓRICO DO NAVEGADOR
    ====================================================== */
    const ROUTE_TO_MODULE = {
      'dashboard':'Dashboard',
      'pedidos':'Pedidos',
      'financeiro':'Financeiro',
      'produtos':'Produtos',
      'clientes':'Clientes',
      'formas-de-pagamento':'Formas de pagamento',
      'formas-de-entrega':'Formas de entrega',
      'horarios':'Horários',
      'configuracoes':'Configurações'
    };
    function moduleToRoute(name){
      return Object.keys(ROUTE_TO_MODULE).find(route => ROUTE_TO_MODULE[route]===name) || 'dashboard';
    }
    function routeToModule(){
      const route=(location.hash||'#dashboard').replace(/^#/,'').trim().toLowerCase();
      return ROUTE_TO_MODULE[route] || 'Dashboard';
    }
    function updateActiveMenu(name){
      document.querySelectorAll('.menu button').forEach(item => {
        const label=item.textContent.replace(/\s+/g,' ').trim();
        item.classList.toggle('active', label.includes(name));
      });
    }
    function navigateToModule(name, options={}){
      const push=options.push!==false;
      const route=moduleToRoute(name);
      const targetHash='#'+route;
      if(push && location.hash!==targetHash){
        history.pushState({kukiModule:name},'',targetHash);
      } else if(!push && location.hash!==targetHash){
        history.replaceState({kukiModule:name},'',targetHash);
      }
      updateActiveMenu(name);
      abrirModulo(name);
    }
    function selectMenu(button, name) {
      navigateToModule(name,{push:true});
    }
    function selectMenuByName(name) {
      navigateToModule(name,{push:true});
    }
    function carregarModuloAtual() { abrirModulo(moduloAtual); }
    function abrirModulo(name) {
      moduloAtual = name;
      const dashboard = document.getElementById('dashboardContent');
      const moduleContent = document.getElementById('moduleContent');
      document.getElementById('pageTitle').textContent = name;
      const subtitles = {
        'Dashboard':'Visão geral da sua loja','Pedidos':'Acompanhe e gerencie todos os pedidos','Produtos':'Cadastre e gerencie os produtos da KUKI','Clientes':'Consulte os clientes cadastrados','Formas de pagamento':'Gerencie as opções de pagamento','Formas de entrega':'Gerencie as formas de entrega','Horários':'Defina os horários de funcionamento da loja','Configurações':'Configurações gerais do sistema','Financeiro':'Controle de despesas e acompanhamento financeiro'
      };
      document.getElementById('pageSubtitle').textContent = subtitles[name] || '';
      if (name === 'Dashboard') { dashboard.style.display='block'; moduleContent.style.display='none'; atualizarDashboard(); return; }
      dashboard.style.display='none'; moduleContent.style.display='block';
      if (name === 'Horários') renderHorariosModule();
      else if (name === 'Financeiro') renderFinanceiroModule();
      else if (name === 'Pedidos') renderPedidosModule();
      else if (CRUD_TABLES[name]) renderCrudModule(name);
      else renderPlaceholderModule(name);
    }
    window.addEventListener('popstate', () => {
      document.getElementById('modalDespesa')?.remove();
      document.body.classList.remove('modal-open');
      const name=routeToModule();
      updateActiveMenu(name);
      abrirModulo(name);
    });
    window.addEventListener('hashchange', () => {
      const name=routeToModule();
      if(name!==moduloAtual){ updateActiveMenu(name); abrirModulo(name); }
    });
    /* =====================================================
       INICIAR
    ====================================================== */
    // Nesta versão o login está temporariamente desativado.
    abrirSistema({ email: 'admin@kuki.local' });
    setTimeout(() => {
      const initialModule=routeToModule();
      const route='#'+moduleToRoute(initialModule);
      if(!location.hash) history.replaceState({kukiModule:initialModule},'',route);
      updateActiveMenu(initialModule);
      abrirModulo(initialModule);
    },0);

  </script>
