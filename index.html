<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KUKI Gerencial</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --vermelho: #a9001d;
      --vermelho-escuro: #820016;
      --vermelho-claro: #c31231;
      --creme: #f8eee4;
      --creme-escuro: #ead7c4;
      --branco: #ffffff;
      --texto: #352c2c;
      --cinza: #777777;
      --borda: #e8ddd3;
      --fundo: #f7f3ef;
      --verde: #1f9d55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background:
        radial-gradient(circle at top left, #f9e7d6, transparent 35%),
        linear-gradient(135deg, #fff8f2, #ead8c8);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.97);
      border-radius: 28px;
      padding: 42px;
      box-shadow: 0 20px 60px rgba(80, 30, 30, 0.16);
      border: 1px solid var(--borda);
    }

    .login-logo {
      display: block;
      width: 210px;
      max-width: 100%;
      margin: 0 auto 10px;
    }

    .login-title {
      text-align: center;
      color: var(--vermelho);
      font-size: 30px;
      font-weight: 800;
      margin-top: 5px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--cinza);
      margin: 10px 0 30px;
      font-size: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--texto);
    }

    .field input {
      width: 100%;
      height: 52px;
      border-radius: 13px;
      border: 1px solid var(--borda);
      padding: 0 16px;
      font-size: 16px;
      outline: none;
      background: #fff;
      transition: 0.2s;
    }

    .field input:focus {
      border-color: var(--vermelho);
      box-shadow: 0 0 0 3px rgba(169, 0, 29, 0.1);
    }

    .login-button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 13px;
      background: var(--vermelho);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    .login-button:hover {
      background: var(--vermelho-escuro);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      display: none;
      margin-top: 18px;
      background: #fff0f1;
      border: 1px solid #f3c4ca;
      color: #a9001d;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
    }

    /* =========================
       SISTEMA
    ========================= */

    #appScreen {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      width: 260px;
      height: 100vh;
      left: 0;
      top: 0;
      background: var(--vermelho);
      color: white;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 3px 0 20px rgba(0,0,0,0.08);
    }

    .sidebar-logo {
      padding: 10px 15px 28px;
      text-align: center;
    }

    .sidebar-logo img {
      width: 160px;
      max-width: 100%;
      background: #fff8f2;
      border-radius: 14px;
      padding: 8px;
    }

    .sidebar-title {
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 8px;
      opacity: 0.85;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .menu button {
      width: 100%;
      border: none;
      background: transparent;
      color: white;
      text-align: left;
      padding: 14px 15px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s;
    }

    .menu button:hover,
    .menu button.active {
      background: rgba(255,255,255,0.18);
    }

    .menu button span {
      display: inline-block;
      width: 30px;
      font-size: 19px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 20px;
    }

    .user-info {
      padding: 12px 14px;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .user-label {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 5px;
    }

    .user-email {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-button {
      width: 100%;
      border: none;
      background: rgba(0,0,0,0.18);
      color: white;
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .logout-button:hover {
      background: rgba(0,0,0,0.28);
    }

    /* =========================
       CONTEÚDO
    ========================= */

    .main {
      margin-left: 260px;
      min-height: 100vh;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
    }

    .page-title h1 {
      font-size: 30px;
      color: var(--vermelho);
      margin-bottom: 5px;
    }

    .page-title p {
      color: var(--cinza);
      font-size: 14px;
    }

    .date-box {
      background: white;
      border: 1px solid var(--borda);
      padding: 12px 17px;
      border-radius: 12px;
      font-size: 13px;
      color: var(--cinza);
    }

    .dashboard {
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      border: 1px solid var(--borda);
      box-shadow: 0 5px 18px rgba(50, 30, 20, 0.04);
    }

    .card-icon {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--creme);
      font-size: 22px;
      margin-bottom: 15px;
    }

    .card-label {
      font-size: 13px;
      color: var(--cinza);
      font-weight: 600;
    }

    .card-value {
      font-size: 29px;
      font-weight: 800;
      color: var(--texto);
      margin-top: 5px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
    }

    .dashboard-quick-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .panel {
      background: white;
      border: 1px solid var(--borda);
      border-radius: 18px;
      padding: 24px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .panel h2 {
      font-size: 19px;
      color: var(--texto);
    }

    .panel-link {
      border: none;
      background: none;
      color: var(--vermelho);
      cursor: pointer;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: var(--cinza);
    }

    .empty-state-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .welcome {
      background:
        linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
      color: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .welcome p {
      opacity: 0.88;
      font-size: 14px;
      line-height: 1.5;
    }

    .mobile-header {
      display: none;
    }



    /* =========================
       BEM-VINDO / NOTIFICAÇÕES / MÓDULOS
    ========================= */
    .sidebar-welcome {
      margin: 6px 6px 22px;
      padding: 18px 15px;
      border-radius: 16px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.16);
    }
    .sidebar-welcome strong { display:block; font-size:18px; margin-bottom:6px; }
    .sidebar-welcome span { font-size:12px; line-height:1.45; opacity:.88; }

    .notification-button {
      border: 1px solid var(--borda);
      background: white;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      cursor: pointer;
      position: relative;
      font-size: 20px;
    }
    .notification-badge {
      position:absolute; right:-5px; top:-5px;
      min-width:20px; height:20px; padding:0 5px;
      border-radius:20px; background:var(--vermelho); color:#fff;
      font-size:11px; font-weight:800; display:none;
      align-items:center; justify-content:center;
      border:2px solid #fff;
    }
    .topbar-actions { display:flex; align-items:center; gap:12px; }

    .toast-container {
      position:fixed; right:24px; top:24px; z-index:5000;
      display:flex; flex-direction:column; gap:10px; max-width:360px;
    }
    .toast {
      background:#fff; border:1px solid var(--borda); border-left:5px solid var(--vermelho);
      border-radius:14px; padding:14px 16px; box-shadow:0 14px 35px rgba(50,20,20,.18);
      animation:slideIn .25s ease;
    }
    .toast strong { display:block; color:var(--vermelho); margin-bottom:4px; }
    .toast p { color:var(--texto); font-size:13px; }
    @keyframes slideIn { from {opacity:0; transform:translateX(30px)} to {opacity:1; transform:none} }

    .module-panel { background:#fff; border:1px solid var(--borda); border-radius:18px; padding:24px; }
    .module-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .primary-button { border:none; background:var(--vermelho); color:#fff; padding:11px 16px; border-radius:10px; font-weight:800; cursor:pointer; }
    .primary-button:hover { background:var(--vermelho-escuro); }
    .table-wrap { overflow-x:auto; }
    .data-table { width:100%; border-collapse:collapse; min-width:680px; }
    .data-table th, .data-table td { padding:13px 12px; border-bottom:1px solid var(--borda); text-align:left; font-size:14px; }
    .data-table th { color:var(--cinza); font-size:12px; text-transform:uppercase; letter-spacing:.3px; }
    .time-input { border:1px solid var(--borda); border-radius:9px; padding:8px; color:var(--texto); }
    .switch { position:relative; display:inline-block; width:48px; height:26px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background:#bbb; border-radius:30px; cursor:pointer; transition:.2s; }
    .slider:before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
    .switch input:checked + .slider { background:var(--verde); }
    .switch input:checked + .slider:before { transform:translateX(22px); }
    .status-pill { display:inline-block; padding:5px 9px; border-radius:20px; background:var(--creme); color:var(--texto); font-size:12px; font-weight:700; }
    .recent-orders-list { display:grid; gap:10px; }
    .recent-order { display:flex; justify-content:space-between; gap:12px; padding:13px; border:1px solid var(--borda); border-radius:12px; }
    .recent-order strong { display:block; margin-bottom:4px; }
    .recent-order small { color:var(--cinza); }
    .empty-module { text-align:center; padding:50px 20px; color:var(--cinza); }

    /* AÇÕES DE PEDIDOS - HARDENED */
    .actions-cell { white-space:nowrap; }
    .action-group { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .secondary-button, .danger-button, .locked-button { border:none; padding:9px 12px; border-radius:9px; font-weight:800; cursor:pointer; font-size:12px; }
    .secondary-button { background:#eee6df; color:var(--texto); }
    .secondary-button:hover { filter:brightness(.97); }
    .danger-button { background:#a9001d; color:#fff; }
    .danger-button:hover { background:#820016; }
    .locked-button { background:#f1f1f1; color:#777; cursor:not-allowed; }
    .status-select { border:1px solid var(--borda); border-radius:9px; padding:8px; background:#fff; min-width:125px; }
    .order-lock-note { margin-top:14px; padding:12px 14px; border-radius:10px; background:#fff7e8; border:1px solid #f0d49a; color:#7a5b17; font-size:13px; }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
        padding: 20px 15px;
      }

      .mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--vermelho);
        padding: 13px 15px;
        border-radius: 15px;
        margin-bottom: 20px;
      }

      .mobile-header img {
        width: 110px;
        background: #fff8f2;
        padding: 5px;
        border-radius: 8px;
      }

      .mobile-header button {
        border: none;
        background: rgba(255,255,255,0.16);
        color: white;
        padding: 9px 12px;
        border-radius: 8px;
        font-weight: 700;
      }

      .topbar {
        display: block;
      }

      .topbar-actions { margin-top:15px; justify-content:space-between; }
      .toast-container { right:12px; left:12px; top:12px; max-width:none; }

      .date-box {
        margin-top: 15px;
        display: inline-block;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .card {
        padding: 16px;
      }

      .card-value {
        font-size: 23px;
      }

      .login-card {
        padding: 30px 22px;
      }

      .login-title {
        font-size: 26px;
      }
    }

    @media (max-width: 430px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 15px;
      }
    }
  
    /* CRUD módulos */
    .crud-form-box{margin:20px 0;padding:18px;border:1px solid #ead7c7;border-radius:16px;background:#fffaf6}
    .crud-form-box h3{margin-bottom:14px}.crud-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-weight:700}.crud-field input{padding:12px;border:1px solid #d9c8bb;border-radius:10px;font:inherit}.check-field{flex-direction:row;align-items:center}.crud-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions-inline{display:flex;gap:8px;align-items:center;justify-content:flex-start;flex-wrap:nowrap}.actions-inline button{margin:0!important;min-width:92px}.crud-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}.crud-grid .crud-field{margin-bottom:0}
    @media(max-width:700px){.actions-inline{gap:6px}.actions-inline button{min-width:0;padding:9px 8px;font-size:12px}.crud-grid{grid-template-columns:1fr}}


    .dashboard-card-action{
      width:100%;
      font:inherit;
      color:inherit;
      text-align:left;
      cursor:pointer;
      appearance:none;
    }
    .dashboard-card-action:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 28px rgba(90,55,35,.12);
    }
    .dashboard-card-action:focus-visible{
      outline:3px solid rgba(174,0,35,.28);
      outline-offset:3px;
    }
    .card-hint{
      margin-top:12px;
      font-size:.88rem;
      font-weight:600;
      color:var(--cinza);
      line-height:1.35;
    }


    .card-novos-destaque{
      position:relative;
      overflow:visible;
      border:2px solid rgba(174,0,35,.82) !important;
      animation:kukiCardPulse 1.15s ease-in-out infinite;
    }
    .card-novos-destaque::before{
      content:'';
      position:absolute;
      inset:-5px;
      border-radius:inherit;
      pointer-events:none;
      box-shadow:0 0 0 0 rgba(174,0,35,.34);
      animation:kukiRingPulse 1.15s ease-out infinite;
    }
    .card-novos-destaque.card-normalizado{
      animation:none;
      border-color:var(--borda) !important;
    }
    .card-novos-destaque.card-normalizado::before{
      animation:none;
      box-shadow:none;
    }
    .novo-alerta-pulse{
      position:absolute;
      top:16px;
      right:16px;
      width:12px;
      height:12px;
      border-radius:50%;
      background:#b00020;
      box-shadow:0 0 0 0 rgba(176,0,32,.5);
      animation:kukiDotPulse 1.15s infinite;
    }
    .card-normalizado .novo-alerta-pulse{ display:none; }
    @keyframes kukiCardPulse{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-3px); }
    }
    @keyframes kukiRingPulse{
      0%{ box-shadow:0 0 0 0 rgba(174,0,35,.34); }
      70%{ box-shadow:0 0 0 13px rgba(174,0,35,0); }
      100%{ box-shadow:0 0 0 0 rgba(174,0,35,0); }
    }
    @keyframes kukiDotPulse{
      0%{ box-shadow:0 0 0 0 rgba(176,0,32,.48); }
      70%{ box-shadow:0 0 0 10px rgba(176,0,32,0); }
      100%{ box-shadow:0 0 0 0 rgba(176,0,32,0); }
    }
    @media (prefers-reduced-motion: reduce){
      .card-novos-destaque,.card-novos-destaque::before,.novo-alerta-pulse{animation:none !important;}
    }


    .financeiro-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0}
    .financeiro-card{padding:20px;border:1px solid var(--borda);border-radius:18px;background:#fff}
    .financeiro-card .label{font-size:.82rem;font-weight:800;color:var(--cinza);letter-spacing:.04em}
    .financeiro-card .value{font-size:1.65rem;font-weight:900;margin-top:8px}
    .financeiro-card .hint{font-size:.8rem;color:var(--cinza);margin-top:6px}
    .financeiro-card.negativo .value{color:#b00020}
    .financeiro-card.positivo .value{color:#137333}
    .financeiro-filtros{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:12px 0 18px}
    .financeiro-filtros .field{margin:0;min-width:170px;flex:1}
    .financeiro-tabela{width:100%;border-collapse:collapse}
    .financeiro-tabela th,.financeiro-tabela td{padding:12px 10px;border-bottom:1px solid var(--borda);text-align:left}
    .financeiro-tabela th{font-size:.78rem;color:var(--cinza);text-transform:uppercase}
    .actions-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    @media(max-width:760px){
      .financeiro-grid{grid-template-columns:1fr}
      .financeiro-tabela{display:block;overflow-x:auto;white-space:nowrap}
      .financeiro-filtros .field{min-width:100%}
    }


    .financeiro-menu-button{
      display:flex !important;
      align-items:center;
      width:100%;
      visibility:visible !important;
      opacity:1 !important;
    }

</style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginScreen">

    <div class="login-card">

      <img
        src="logo-kuki-transparente.png"
        alt="KUKI Cookies"
        class="login-logo"
      >

      <h1 class="login-title">KUKI GERENCIAL</h1>

      <p class="login-subtitle">
        Acesse o sistema de gerenciamento da loja
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="username">Usuário</label>
          <input
            type="text"
            id="username"
            placeholder="Digite seu usuário"
            required
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
          >
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            placeholder="Digite sua senha"
            required
            autocomplete="current-password"
          >
        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          ENTRAR
        </button>

      </form>

      <div id="loginError" class="login-error"></div>

    </div>

  </section>


  <!-- =========================
       SISTEMA
  ========================== -->

  <section id="appScreen">

    <!-- MENU LATERAL -->

    <aside class="sidebar">

      <div class="sidebar-welcome">
        <strong>Bem-vindo! 🍪</strong>
        <span>Gerencie sua KUKI, acompanhe os pedidos e mantenha a loja sempre atualizada.</span>
      </div>

      <nav class="menu">

        <button class="active" onclick="selectMenu(this, 'Dashboard')">
          <span>📊</span> Dashboard
        </button>

        <button onclick="selectMenu(this, 'Pedidos')">
          <span>📦</span> Pedidos
        </button>

        <!-- FINANCEIRO: mantido em posição alta e ainda acima de Configurações -->
        <button class="financeiro-menu-button" type="button" onclick="selectMenu(this, 'Financeiro')">
          <span>💰</span> Financeiro
        </button>

        <button onclick="selectMenu(this, 'Produtos')">
          <span>🍪</span> Produtos
        </button>

        <button onclick="selectMenu(this, 'Clientes')">
          <span>👥</span> Clientes

    function getValue(obj, names, fallback='') {
      if (!obj) return fallback;
      const map = {};
      Object.keys(obj).forEach(k => map[k.toLowerCase()] = k);
      for (const name of names) {
        const key = map[name.toLowerCase()];
        if (key !== undefined && obj[key] !== null && obj[key] !== undefined) return obj[key];
      }
      return fallback;
    }

    async function restRequest(table, path='', options={}) {
      // Usa o token do usuário logado. A chave publishable continua no header apikey,
      // mas o Authorization precisa representar o usuário autenticado para respeitar RLS.
      let accessToken = SUPABASE_KEY;
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session && data.session.access_token) accessToken = data.session.access_token;
      } catch(e) {}

      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      const url = SUPABASE_URL + '/rest/v1/' + encodeURIComponent(table) + path;
      const response = await fetch(url, {...options, headers});
      const text = await response.text();
      let body = null;
      try { body = text ? JSON.parse(text) : null; } catch(e) { body = text; }
      if (!response.ok) {
        const details = body && typeof body === 'object'
          ? [body.message, body.details, body.hint, body.code].filter(Boolean).join(' | ')
          : text;
        throw new Error('Tabela ' + table + ' — HTTP ' + response.status + ': ' + (details || text || 'Erro ao consultar dados.'));
      }
      return body;
    }

    async function getTable(table, query='?select=*') {
      try { return await restRequest(table, query); }
      catch (firstError) {
        const alternative = table === table.toUpperCase() ? table.toLowerCase() : table.toUpperCase();
        if (alternative !== table) return await restRequest(alternative, query);
        throw firstError;
      }
    }

    function formatMoney(value) {
      const n = Number(String(value ?? 0).replace(',', '.')) || 0;
      return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    }

    function formatDateTime(value) {
      if (!value) return '';
      const d = new Date(value);
      return isNaN(d) ? String(value) : d.toLocaleString('pt-BR');
    }

    function pedidoKey(p) {
      return String(getValue(p, ['id','ID','pedido_id','PEDIDO_ID'], '')) + '|' + String(getValue(p, ['created_at','DATA','data','data_pedido','DATA_PEDIDO'], ''));
    }

    function sortPedidos(pedidos) {
      return [...pedidos].sort((a,b) => {
        const da = new Date(getValue(a,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],0)).getTime() || 0;
        const db = new Date(getValue(b,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],0)).getTime() || 0;
        return db-da;
      });
    }

    async function carregarPedidos(initial=false) {
      try {
        const rows = await getTable('PEDIDOS', '?select=*');
        pedidosCache = Array.isArray(rows) ? sortPedidos(rows) : [];
        const latest = pedidosCache[0] ? pedidoKey(pedidosCache[0]) : null;
        if (!initial && ultimoPedidoChave && latest && latest !== ultimoPedidoChave) {
          const novos = pedidosCache.filter(p => pedidoKey(p) !== ultimoPedidoChave);
          if (novos.length) notificarNovoPedido(novos.length, novos[0]);
        }
        ultimoPedidoChave = latest;
        atualizarDashboard();
        if (moduloAtual === 'Pedidos') renderPedidosModule();
      } catch (error) {
        console.error('Pedidos:', error);
        const recentOrders = document.getElementById('recentOrders');
        if (recentOrders) recentOrders.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><strong>Não foi possível carregar os pedidos.</strong><p style="margin-top:8px;">Confira o acesso à tabela PEDIDOS.</p></div>';
      }
    }

    function localDateKey(value) {
      const d = value instanceof Date ? value : new Date(value);
      if (isNaN(d)) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function atualizarDashboard() {
      // IMPORTANTE: usa a data LOCAL do navegador. Assim, um pedido criado
      // às 21:51 do dia anterior no Brasil não é contado como "hoje" apenas
      // porque o timestamp do Supabase está armazenado em UTC.
      const hoje = localDateKey(new Date());
      const pedidosHoje = pedidosCache.filter(p => {
        const v = getValue(p,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],'');
        return localDateKey(v) === hoje;
      });

      const novos = pedidosCache.filter(p => {
        const st = String(getValue(p,['status','STATUS'],'')).toUpperCase().trim();
        return ['NOVO','NOVOS'].includes(st);
      }).length;

      const pedidosHojeEl = document.getElementById('pedidosHoje');
      const pedidosNovosEl = document.getElementById('pedidosNovos');
      if (pedidosHojeEl) pedidosHojeEl.textContent = pedidosHoje.length;
      if (pedidosNovosEl) pedidosNovosEl.textContent = novos;

      const cardNovos = document.querySelector('.card-novos-destaque');
      if (cardNovos) {
        cardNovos.classList.toggle('card-normalizado', novos <= 0);
        cardNovos.setAttribute(
          'aria-label',
          novos > 0
            ? `Há ${novos} pedido${novos === 1 ? '' : 's'} novo${novos === 1 ? '' : 's'} aguardando atenção`
            : 'Não há pedidos novos'
        );
      }
    }

    function renderRecentOrders() {
      const el = document.getElementById('recentOrders');
      if (!el) return;
      if (!pedidosCache.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><strong>Nenhum pedido encontrado.</strong></div>';
        return;
      }
      el.innerHTML = pedidosCache.slice(0,5).map(p => {
        const id = getValue(p,['id','ID','pedido_id','PEDIDO_ID'],'#');
        const nome = getValue(p,['cliente_nome','CLIENTE_NOME','nome_cliente','NOME_CLIENTE','nome','NOME'],'Pedido');
        const total = getValue(p,['total','TOTAL','valor_total','VALOR_TOTAL','valor'],'');
        const data = getValue(p,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],'');
        return '<div class="recent-order"><div><strong>#'+escapeHtml(id)+' · '+escapeHtml(nome)+'</strong><small>'+escapeHtml(formatDateTime(data))+'</small></div><div><strong>'+escapeHtml(total !== '' ? formatMoney(total) : '')+'</strong></div></div>';
      }).join('');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function showToast(title, message) {
      const box = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '<strong>'+escapeHtml(title)+'</strong><p>'+escapeHtml(message)+'</p>';
      box.appendChild(toast);
      setTimeout(() => toast.remove(), 7000);
    }

    function beep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; gain.gain.value = 0.08;
        osc.start(); setTimeout(() => { osc.stop(); ctx.close(); }, 180);
      } catch(e) {}
    }

    function atualizarBadge() {
      const badge = document.getElementById('notificationBadge');
      badge.textContent = notificacoesPendentes > 99 ? '99+' : notificacoesPendentes;

    function notificarNovoPedido(qtd, pedido) {

        new Notification('KUKI Gerencial', { body: qtd > 1 ? qtd+' novos pedidos chegaram.' : 'Novo pedido #'+id });

    /* =====================================================
       HORÁRIOS
    ====================================================== */
    async function carregarHorarios() {
      const rows = await getTable('HORARIOS','?select=*');
      horariosCache = Array.isArray(rows) ? rows : [];
      const ordem = ['SEGUNDA','TERÇA','TERCA','QUARTA','QUINTA','SEXTA','SÁBADO','SABADO','DOMINGO'];
      horariosCache.sort((a,b) => ordem.indexOf(String(getValue(a,['DIA_SEMANA','dia_semana'])).toUpperCase()) - ordem.indexOf(String(getValue(b,['DIA_SEMANA','dia_semana'])).toUpperCase()));
      return horariosCache;
    }

    function normalizeTime(v) { return v ? String(v).slice(0,5) : ''; }

    async function renderHorariosModule() {
      const container = document.getElementById('moduleContent');
      container.innerHTML = '<div class="module-panel"><div class="module-toolbar"><div><h2>🕐 Horários de funcionamento</h2><p style="color:var(--cinza);margin-top:6px;">Altere os dias, horários e o funcionamento da loja. As mudanças são gravadas diretamente na tabela existente.</p></div><button class="primary-button" onclick="carregarModuloAtual()">↻ Atualizar</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Dia</th><th>Aberto?</th><th>Abertura</th><th>Fechamento</th><th></th></tr></thead><tbody id="horariosBody"><tr><td colspan="5">Carregando...</td></tr></tbody></table></div></div>';
      try {
        await carregarHorarios();
        document.getElementById('horariosBody').innerHTML = horariosCache.map((h,i) => {
          const dia = getValue(h,['DIA_SEMANA','dia_semana'],'');
          const aberto = !!getValue(h,['ABERTO','aberto'],false);
          const abertura = normalizeTime(getValue(h,['HORA_ABERTURA','hora_abertura'],''));
          const fechamento = normalizeTime(getValue(h,['HORA_FECHAMENTO','hora_fechamento'],''));
          return '<tr data-index="'+i+'"><td><strong>'+escapeHtml(dia)+'</strong></td><td><label class="switch"><input class="h-aberto" type="checkbox" '+(aberto?'checked':'')+' onchange="toggleHorarioInputs('+i+')"><span class="slider"></span></label></td><td><input class="time-input h-abertura" type="time" value="'+escapeHtml(abertura)+'" '+(!aberto?'disabled':'')+'></td><td><input class="time-input h-fechamento" type="time" value="'+escapeHtml(fechamento)+'" '+(!aberto?'disabled':'')+'></td><td><button class="primary-button" onclick="salvarHorario('+i+')">Salvar</button></td></tr>';
        }).join('');
      } catch(error) {
        container.querySelector('#horariosBody').innerHTML = '<tr><td colspan="5">Erro ao carregar horários: '+escapeHtml(error.message)+'</td></tr>';
      }
    }

    function toggleHorarioInputs(index) {
      const row = document.querySelector('#horariosBody tr[data-index="'+index+'"]');
      const aberto = row.querySelector('.h-aberto').checked;
      row.querySelector('.h-abertura').disabled = !aberto;
      row.querySelector('.h-fechamento').disabled = !aberto;
    }

    async function salvarHorario(index) {
      const h = horariosCache[index];
      const row = document.querySelector('#horariosBody tr[data-index="'+index+'"]');
      const id = getValue(h,['id','ID']);
      const aberto = row.querySelector('.h-aberto').checked;
      const abertura = row.querySelector('.h-abertura').value || null;
      const fechamento = row.querySelector('.h-fechamento').value || null;
      if (aberto && (!abertura || !fechamento)) { showToast('Atenção','Informe a hora de abertura e fechamento.'); return; }
      const body = { ABERTO: aberto, HORA_ABERTURA: aberto ? abertura : null, HORA_FECHAMENTO: aberto ? fechamento : null };
      try {
        await restRequest('HORARIOS', '?id=eq.'+encodeURIComponent(id), { method:'PATCH', headers:{'Prefer':'return=representation'}, body:JSON.stringify(body) });
      } catch(e) {
        await restRequest('horarios', '?id=eq.'+encodeURIComponent(id), { method:'PATCH', headers:{'Prefer':'return=representation'}, body:JSON.stringify({ aberto, hora_abertura: aberto ? abertura : null, hora_fechamento: aberto ? fechamento : null }) });
      }
      showToast('Horário salvo!','As alterações foram gravadas com sucesso.');
      await carregarHorarios();
      renderHorariosModule();
    }

    /* =====================================================
       PEDIDOS - REGRAS DE INTEGRIDADE
       Pedido concluído/fechado/finalizado é imutável na UI.
       Toda operação valida novamente o status antes do PATCH/DELETE.
    ====================================================== */
    const PEDIDO_STATUS_BLOQUEADOS = new Set([
      'CONCLUIDO','CONCLUÍDO','FECHADO','FINALIZADO','ENCERRADO'
    ]);

    function normalizarStatus(status) {
      return String(status || '')
        .trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toUpperCase();
    }

    function pedidoEstaBloqueado(status) {
      return PEDIDO_STATUS_BLOQUEADOS.has(normalizarStatus(status));
    }

    function getPedidoId(pedido) {
      return getValue(pedido, ['id','ID','pedido_id','PEDIDO_ID'], null);
    }

    function getPedidoStatus(pedido) {
      return getValue(pedido, ['status','STATUS'], 'NOVO');
    }

    async function patchPedido(id, payload) {
      const filter = '?id=eq.' + encodeURIComponent(id);
      try {
        return await restRequest('PEDIDOS', filter, {
          method:'PATCH',
          headers:{'Prefer':'return=representation'},
          body:JSON.stringify(payload)
        });
      } catch (e) {
        const lowerPayload = {};
        Object.keys(payload).forEach(k => lowerPayload[k.toLowerCase()] = payload[k]);
        return await restRequest('pedidos', filter, {
          method:'PATCH',
          headers:{'Prefer':'return=representation'},
          body:JSON.stringify(lowerPayload)
        });
      }
    }

    async function deletePedido(id) {
      const filter = '?id=eq.' + encodeURIComponent(id);
      try {
        return await restRequest('PEDIDOS', filter, { method:'DELETE' });
      } catch (e) {
        return await restRequest('pedidos', filter, { method:'DELETE' });
      }
    }

    function obterPedidoAtual(id) {
      return pedidosCache.find(p => String(getPedidoId(p)) === String(id)) || null;
    }

    function normalizarTelefoneWhatsApp(valor) {
      let numero = String(valor ?? '').replace(/\D/g, '');
      if (!numero) return '';
      // Se vier apenas DDD + número, acrescenta o DDI do Brasil.
      if (numero.length === 10 || numero.length === 11) numero = '55' + numero;
      return numero;
    }

    function normalizarTextoComparacao(valor) {
      return String(valor ?? '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .toUpperCase().trim().replace(/\s+/g,' ');
    }

    function pontuarClienteDoPedido(cliente, pedido) {
      let pontos = 0;
      const cCep = String(getValue(cliente,['CEP','cep'],'')).replace(/\D/g,'');
      const pCep = String(getValue(pedido,['CEP','cep'],'')).replace(/\D/g,'');
      if (cCep && pCep && cCep === pCep) pontos += 4;

      const cEndereco = normalizarTextoComparacao(getValue(cliente,['ENDERECO','endereco','RUA','rua'],''));
      const pEndereco = normalizarTextoComparacao(getValue(pedido,['ENDERECO','endereco','RUA','rua'],''));
      if (cEndereco && pEndereco && cEndereco === pEndereco) pontos += 4;

      const cNumero = normalizarTextoComparacao(getValue(cliente,['NUMERO','numero'],''));
      const pNumero = normalizarTextoComparacao(getValue(pedido,['NUMERO','numero'],''));
      if (cNumero && pNumero && cNumero === pNumero) pontos += 2;

      const cBairro = normalizarTextoComparacao(getValue(cliente,['BAIRRO','bairro'],''));
      const pBairro = normalizarTextoComparacao(getValue(pedido,['BAIRRO','bairro'],''));
      if (cBairro && pBairro && cBairro === pBairro) pontos += 2;

      const cCidade = normalizarTextoComparacao(getValue(cliente,['CIDADE','cidade'],''));
      const pCidade = normalizarTextoComparacao(getValue(pedido,['CIDADE','cidade'],''));
      if (cCidade && pCidade && cCidade === pCidade) pontos += 1;

      return pontos;
    }

    function montarClienteResolvido(c, origem) {
      if (!c) return null;
      const telefone = getValue(c,['WHATSAPP','whatsapp','TELEFONE','telefone','CELULAR','celular','PHONE','phone'],'');
      if (!normalizarTelefoneWhatsApp(telefone)) return null;
      return {
        id: getValue(c,['ID','id'],null),
        whatsapp: telefone,
        nome: getValue(c,['NOME','nome','CLIENTE_NOME','cliente_nome'],'Cliente'),
        origem: origem || 'CLIENTES'
      };
    }

    async function obterClienteDoPedido(pedido) {
      // 1) Telefone diretamente no pedido.
      const direto = getValue(pedido,['WHATSAPP','whatsapp','TELEFONE','telefone','CELULAR','celular','PHONE','phone'],'');
      const nomeDireto = getValue(pedido,['CLIENTE_NOME','cliente_nome','NOME_CLIENTE','nome_cliente','NOME','nome'],'');
      if (normalizarTelefoneWhatsApp(direto)) {
        return { id:getValue(pedido,['CLIENTE_ID','cliente_id'],null), whatsapp:direto, nome:nomeDireto || 'Cliente', origem:'PEDIDO' };
      }

      const clientes = await getTable('CLIENTES','?select=*');
      const lista = Array.isArray(clientes) ? clientes : [];

      // 2) CLIENTE_ID gravado no pedido.
      const clienteId = getValue(pedido,['CLIENTE_ID','cliente_id'],null);
      if (clienteId !== null && clienteId !== undefined && String(clienteId) !== '') {
        const encontrado = lista.find(c => String(getValue(c,['ID','id'],'')) === String(clienteId));
        const resolvido = montarClienteResolvido(encontrado,'CLIENTE_ID');
        if (resolvido) return resolvido;
      }

      // 3) Pedidos antigos podem estar sem CLIENTE_ID. Procura um cliente pelo endereço.
      // Só aceita um resultado inequivocamente melhor para evitar notificação para pessoa errada.
      const candidatos = lista
        .map(c => ({ cliente:c, pontos:pontuarClienteDoPedido(c,pedido) }))
        .filter(x => x.pontos >= 8)
        .sort((a,b) => b.pontos - a.pontos);

      if (candidatos.length) {
        const melhor = candidatos[0];
        const segundo = candidatos[1];
        if (!segundo || melhor.pontos > segundo.pontos) {
          const resolvido = montarClienteResolvido(melhor.cliente,'ENDERECO');
          if (resolvido) return resolvido;
        }
      }

      return null;
    }

    async function enviarStatusWhatsApp(pedido, statusAnterior, novoStatus, clienteResolvido=null) {
      const cliente = clienteResolvido || await obterClienteDoPedido(pedido);
      const telefone = cliente && cliente.whatsapp ? normalizarTelefoneWhatsApp(cliente.whatsapp) : '';
      if (!telefone) {
        throw new Error('Não foi possível localizar um cliente com TELEFONE/WHATSAPP para este pedido. Cadastre ou vincule o cliente antes de enviar a notificação.');
      }
      const numeroPedido = getValue(pedido,['NUMERO_PEDIDO','numero_pedido','ID','id'],'');
      const payload = {
        evento: 'STATUS_PEDIDO_ATUALIZADO',
        pedido_id: getPedidoId(pedido),
        numero_pedido: numeroPedido,
        status_anterior: statusAnterior,
        novo_status: novoStatus,
        status: novoStatus,
        cliente_id: cliente.id ?? getValue(pedido,['CLIENTE_ID','cliente_id'],null),
        cliente: cliente.nome || 'Cliente',
        cliente_nome: cliente.nome || 'Cliente',
        telefone: telefone,
        whatsapp: telefone,
        endereco: getValue(pedido,['ENDERECO','endereco'],''),
        numero: getValue(pedido,['NUMERO','numero'],''),
        complemento: getValue(pedido,['COMPLEMENTO','complemento'],''),
        bairro: getValue(pedido,['BAIRRO','bairro'],''),
        cidade: getValue(pedido,['CIDADE','cidade'],''),
        cep: getValue(pedido,['CEP','cep'],''),
        valor_total: getValue(pedido,['VALOR_TOTAL','valor_total','TOTAL','total'],null),
        observacao: getValue(pedido,['OBSERVACAO','observacao'],'')
      };
      const response = await fetch(STATUS_PEDIDO_WEBHOOK_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      const respostaTexto = await response.text();
      if (!response.ok) throw new Error('Webhook respondeu HTTP '+response.status+(respostaTexto ? ': '+respostaTexto : ''));
      return true;
    }

    async function atualizarStatusPedido(id) {
      const pedido = obterPedidoAtual(id);
      if (!pedido) { showToast('Pedido não encontrado','Atualize a lista e tente novamente.'); return; }
      const statusAtual = getPedidoStatus(pedido);
      if (pedidoEstaBloqueado(statusAtual)) { showToast('🔒 Pedido bloqueado','Pedidos concluídos, fechados ou finalizados não podem ser alterados.'); return; }
      const select = document.getElementById('statusPedido_'+id);
      const novoStatus = select ? String(select.value || '').trim() : '';
      if (!novoStatus) { showToast('Status obrigatório','Escolha o novo status.'); return; }
      if (normalizarStatus(novoStatus) === normalizarStatus(statusAtual)) { showToast('Sem alteração','Escolha um status diferente do atual.'); return; }
      if (!confirm('Confirmar alteração do status do pedido #'+id+' de "'+statusAtual+'" para "'+novoStatus+'"?')) return;

      try {
        // Resolve o cliente antes de atualizar. Se o pedido antigo estiver sem CLIENTE_ID,
        // tenta identificá-lo pelo endereço e passa a gravar o vínculo automaticamente.
        let clienteResolvido = null;
        try { clienteResolvido = await obterClienteDoPedido(pedido); }
        catch (e) { console.error('Erro ao localizar cliente:',e); }

        const payloadUpdate = { STATUS: novoStatus, DATA_ATUALIZACAO: new Date().toISOString() };
        const clienteIdAtual = getValue(pedido,['CLIENTE_ID','cliente_id'],null);
        if ((clienteIdAtual === null || clienteIdAtual === undefined || clienteIdAtual === '') && clienteResolvido && clienteResolvido.id !== null && clienteResolvido.id !== undefined) {
          payloadUpdate.CLIENTE_ID = clienteResolvido.id;
          pedido.CLIENTE_ID = clienteResolvido.id;
        }

        await patchPedido(id, payloadUpdate);

        try {
          await enviarStatusWhatsApp(pedido, statusAtual, novoStatus, clienteResolvido);
          showToast('Status atualizado','Pedido atualizado e mensagem enviada ao WhatsApp do cliente.');
        } catch (zapError) {
          console.error('WhatsApp:', zapError);
          showToast('Status atualizado','Pedido salvo, mas a mensagem do WhatsApp não foi enviada: '+zapError.message);
        }
        await carregarPedidos(false);
      } catch (error) {
        console.error('Erro ao alterar status:', error);
        showToast('Erro ao atualizar','Não foi possível alterar o status: ' + error.message);
      }
    }

    async function editarPedido(id) {
      const pedido = obterPedidoAtual(id);
      if (!pedido) { showToast('Pedido não encontrado','Atualize a lista e tente novamente.'); return; }
      if (pedidoEstaBloqueado(getPedidoStatus(pedido))) {
        showToast('🔒 Pedido bloqueado','Este pedido está concluído/fechado e só pode ser consultado.');
        return;
      }

      const totalAtual = getValue(pedido,['VALOR_TOTAL','valor_total','TOTAL','total'], '');
      const obsAtual = getValue(pedido,['OBSERVACAO','observacao'], '');
      const novoTotal = prompt('Valor total do pedido #' + id + ':', String(totalAtual ?? ''));
      if (novoTotal === null) return;
      const novaObs = prompt('Observação do pedido #' + id + ':', String(obsAtual ?? ''));
      if (novaObs === null) return;
      const numero = Number(String(novoTotal).replace(',', '.'));
      if (!Number.isFinite(numero) || numero < 0) {
        showToast('Valor inválido','Informe um valor numérico válido.');
        return;
      }
      if (!confirm('Confirmar alteração do pedido #' + id + '?')) return;

      try {
        await patchPedido(id, {
          VALOR_TOTAL: numero,
          OBSERVACAO: novaObs,
          DATA_ATUALIZACAO: new Date().toISOString()
        });
        showToast('Pedido atualizado','As alterações foram gravadas com sucesso.');
        await carregarPedidos(false);
      } catch (error) {
        console.error('Erro ao editar pedido:', error);
        showToast('Erro ao atualizar','Não foi possível salvar: ' + error.message);
      }
    }

    async function excluirPedido(id) {
      const pedido = obterPedidoAtual(id);
      if (!pedido) { showToast('Pedido não encontrado','Atualize a lista e tente novamente.'); return; }
      if (pedidoEstaBloqueado(getPedidoStatus(pedido))) {
        showToast('🔒 Pedido bloqueado','Pedidos concluídos/fechados/finalizados não podem ser excluídos.');
        return;
      }
      if (!confirm('EXCLUIR o pedido #' + id + '?\n\nEsta ação não poderá ser desfeita.')) return;
      try {
        await deletePedido(id);
        showToast('Pedido excluído','O pedido #' + id + ' foi removido.');
        await carregarPedidos(false);
      } catch (error) {
        console.error('Erro ao excluir pedido:', error);
        showToast('Erro ao excluir','Não foi possível excluir: ' + error.message);
      }
    }

    /* =====================================================
       CRUD DOS MÓDULOS
    ====================================================== */
    const CRUD_TABLES = {
      'Produtos': { table:'PRODUTOS', icon:'🍪', fields:['NOME','DESCRICAO','PRECO','ATIVO'] },
      'Clientes': { table:'CLIENTES', icon:'👥', fields:['NOME','TELEFONE','WHATSAPP','CEP','ENDERECO','NUMERO','COMPLEMENTO','BAIRRO','CIDADE'] },
      'Formas de pagamento': { table:'FORMAS_PAGAMENTO', icon:'💳', fields:['NOME','ATIVO'] },
      'Formas de entrega': { table:'FORMAS_ENTREGA', icon:'🛵', fields:['NOME','VALOR','ATIVO'] }
    };
    const crudCache = {};
    function normKey(k){ return String(k||'').toUpperCase(); }
    function prettyField(k){ return String(k).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
    function isSystemField(k){ return ['ID','CREATED_AT','UPDATED_AT'].includes(normKey(k)); }
    function isBoolField(k){ return ['ATIVO','ABERTO','DISPONIVEL','HABILITADO'].includes(normKey(k)); }
    function isNumberField(k){ return ['PRECO','VALOR','TOTAL','TAXA','ESTOQUE','QUANTIDADE'].some(x=>normKey(k).includes(x)); }
    async function carregarCrud(name){ const cfg=CRUD_TABLES[name]; if(!cfg)return[]; try{const rows=await getTable(cfg.table,'?select=*');crudCache[name]=Array.isArray(rows)?rows:[];return crudCache[name];}catch(e){console.error(e);throw e;} }
    function crudFields(name,rows){ const cfg=CRUD_TABLES[name],set=new Set(cfg.fields); (rows||[]).forEach(r=>Object.keys(r||{}).forEach(k=>{if(!isSystemField(k))set.add(k)})); return [...set]; }
    function getRecordId(record){ return getValue(record,['id','ID'],null); }
    async function renderCrudModule(name){
      const c=document.getElementById('moduleContent'),cfg=CRUD_TABLES[name]; if(!cfg)return;
      c.innerHTML='<div class="module-panel"><div class="module-toolbar"><div><h2>'+cfg.icon+' '+escapeHtml(name)+'</h2><p style="color:var(--cinza);margin-top:6px;">Carregando dados...</p></div></div></div>';
      let rows=[],loadError=''; try{rows=await carregarCrud(name)}catch(e){loadError='Não foi possível carregar '+cfg.table+': '+(e.message||'erro desconhecido')}
      const fields=crudFields(name,rows), cols=rows.length?Object.keys(rows[0]).filter(k=>!isSystemField(k)):fields;
      const form=fields.map(f=>{const type=isBoolField(f)?'checkbox':(isNumberField(f)?'number':'text');const step=isNumberField(f)?' step="0.01"':'';return type==='checkbox'?'<label class="crud-field check-field"><input type="checkbox" name="'+escapeHtml(f)+'" checked> '+escapeHtml(prettyField(f))+'</label>':'<label class="crud-field">'+escapeHtml(prettyField(f))+'<input'+step+' type="'+type+'" name="'+escapeHtml(f)+'"></label>'}).join('');
      const header=cols.map(k=>'<th>'+escapeHtml(prettyField(k))+'</th>').join('');
      const body=rows.length?rows.map((r,i)=>'<tr>'+cols.map(k=>'<td>'+escapeHtml(isBoolField(k)?(r[k]?'Sim':'Não'):(r[k]??''))+'</td>').join('')+'<td><div class="actions-inline"><button type="button" class="secondary-button" data-crud-action="edit" data-crud-name="'+escapeHtml(name)+'" data-crud-index="'+i+'">✏️ Editar</button><button type="button" class="danger-button" data-crud-action="delete" data-crud-name="'+escapeHtml(name)+'" data-crud-index="'+i+'">🗑 Excluir</button></div></td></tr>').join(''):'<tr><td colspan="'+(cols.length+1)+'">Nenhum registro encontrado. Clique em Novo para cadastrar.</td></tr>';
      c.innerHTML='<div class="module-panel"><div class="module-toolbar"><div><h2>'+cfg.icon+' '+escapeHtml(name)+'</h2><p style="color:var(--cinza);margin-top:6px;">Visualize, cadastre, edite ou exclua informações.</p></div><div class="actions-inline"><button class="primary-button" data-crud-action="new" data-crud-name="'+escapeHtml(name)+'">＋ Novo</button><button class="secondary-button" data-crud-action="refresh" data-crud-name="'+escapeHtml(name)+'">↻ Atualizar</button></div></div>'+(loadError?'<p style="color:#a20c23">'+escapeHtml(loadError)+'</p>':'')+'<div id="crudFormBox" class="crud-form-box" style="display:none"><h3 id="crudFormTitle">Novo cadastro</h3><form id="crudForm"><div class="crud-grid">'+form+'</div><div class="crud-actions"><button type="submit" class="primary-button">💾 Salvar</button><button type="button" class="secondary-button" data-crud-action="cancel">Cancelar</button></div></form></div><div class="table-wrap"><table class="data-table"><thead><tr>'+header+'<th>Ações</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
      const f=document.getElementById('crudForm'); if(f)f.addEventListener('submit',e=>salvarCrud(e,name));
    }
    function abrirFormularioCrud(name){const b=document.getElementById('crudFormBox'),f=document.getElementById('crudForm');if(!b||!f)return;b.style.display='block';document.getElementById('crudFormTitle').textContent='Novo cadastro';f.dataset.editIndex='';f.reset();}
    function fecharFormularioCrud(){const b=document.getElementById('crudFormBox');if(b)b.style.display='none';}
    function editarCrud(name,index){const r=(crudCache[name]||[])[Number(index)];if(!r)return;abrirFormularioCrud(name);document.getElementById('crudFormTitle').textContent='Editar cadastro';const f=document.getElementById('crudForm');f.dataset.editIndex=String(index);Object.keys(r).forEach(k=>{const el=f.elements[k];if(el){if(el.type==='checkbox')el.checked=!!r[k];else el.value=r[k]??'';}});document.getElementById('crudFormBox').scrollIntoView({behavior:'smooth',block:'start'});}
    function collectCrudForm(form){const obj={};Array.from(form.elements).forEach(el=>{if(!el.name)return;let v=el.type==='checkbox'?el.checked:el.value.trim();if(v!==''||el.type==='checkbox')obj[el.name]=isNumberField(el.name)&&v!==''?Number(String(v).replace(',','.')):v;});return obj;}
    async function salvarCrud(e,name){e.preventDefault();const cfg=CRUD_TABLES[name],form=e.currentTarget,body=collectCrudForm(form),idx=form.dataset.editIndex,editing=idx!=='';if(!confirm(editing?'Confirmar as alterações deste cadastro?':'Confirmar a inclusão deste novo cadastro?'))return;try{if(editing){const id=getRecordId(crudCache[name][Number(idx)]);if(id===null||id===undefined)throw new Error('Registro sem ID');await restRequest(cfg.table,'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});}else await restRequest(cfg.table,'',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});showToast('Sucesso',editing?'Alterações salvas.':'Cadastro incluído.');await renderCrudModule(name);}catch(err){console.error(err);showToast('Erro','Não foi possível salvar: '+(err.message||''));}}
    async function excluirCrud(name,index){const old=(crudCache[name]||[])[Number(index)],id=getRecordId(old);if(id===null||id===undefined){showToast('Erro','Não foi possível identificar o registro.');return;}if(!confirm('Confirmar exclusão? Esta ação não poderá ser desfeita.'))return;const cfg=CRUD_TABLES[name];try{await restRequest(cfg.table,'?id=eq.'+encodeURIComponent(id),{method:'DELETE'});showToast('Excluído','Registro removido com sucesso.');await renderCrudModule(name);}catch(err){console.error(err);showToast('Erro','Não foi possível excluir: '+(err.message||''));}}
    document.getElementById('moduleContent').addEventListener('click',function(e){const b=e.target.closest('[data-crud-action]');if(!b)return;const a=b.dataset.crudAction,n=b.dataset.crudName,i=Number(b.dataset.crudIndex);if(a==='new')abrirFormularioCrud(n);else if(a==='refresh')renderCrudModule(n);else if(a==='edit')editarCrud(n,i);else if(a==='delete')excluirCrud(n,i);else if(a==='cancel')fecharFormularioCrud();});

    async function abrirSistema(user) {
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
      document.getElementById('userName').textContent = obterNomeUsuarioPorEmail(user.email);
      await pedirPermissaoNotificacao();
      await carregarPedidos(true);
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = setInterval(() => carregarPedidos(false), 10000);
    }

    async function logout() {
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = null;
      await supabaseClient.auth.signOut();
      appScreen.style.display = 'none'; loginScreen.style.display = 'flex';
      document.getElementById('username').value = ''; document.getElementById('password').value = '';
    }


    /* =====================================================
       FINANCEIRO
    ====================================================== */
    let financeiroDespesasCache = [];
    let financeiroCategoriasCache = [];
    let financeiroFormasCache = [];

    function getField(obj, names, fallback='') {
      return getValue(obj, names, fallback);
    }

    async function carregarFinanceiroDados() {
      // Carrega cada fonte separadamente para identificar exatamente qual tabela falhou.
      const resultados = await Promise.allSettled([
        getTable('FINANCEIRO_DESPESAS', '?select=*'),
        getTable('FINANCEIRO_CATEGORIAS', '?select=*&ativo=eq.true&order=nome.asc'),
        getTable('FORMAS_PAGAMENTO', '?select=*')
      ]);
      const nomes = ['FINANCEIRO_DESPESAS','FINANCEIRO_CATEGORIAS','FORMAS_PAGAMENTO'];
      const erros = resultados.map((r,i) => r.status === 'rejected' ? nomes[i] + ': ' + (r.reason?.message || r.reason) : null).filter(Boolean);
      if (erros.length) throw new Error(erros.join(' — '));
      const [despesas, categorias, formas] = resultados.map(r => r.value);
      financeiroDespesasCache = (Array.isArray(despesas) ? despesas : []).sort((a,b) => {
        const da = new Date(getField(a,['DATA','data','CREATED_AT','created_at'],0)).getTime() || 0;
        const db = new Date(getField(b,['DATA','data','CREATED_AT','created_at'],0)).getTime() || 0;
        return db - da;
      });
      financeiroCategoriasCache = Array.isArray(categorias) ? categorias : [];
      financeiroFormasCache = (Array.isArray(formas) ? formas : []).filter(f => {
        const a = getField(f,['ATIVO','ativo'],true);
        return a !== false && String(a).toLowerCase() !== 'false' && a !== 0 && a !== '0';
      });
    }

    function dataHojeISO() { return localDateKey(new Date()); }

    function valorDespesa(d) {
      return Number(String(getField(d,['VALOR','valor'],0)).replace(',','.')) || 0;
    }

    function dataDespesa(d) {
      return getField(d,['DATA','data','CREATED_AT','created_at'],'');
    }

    function categoriaNome(id) {
      const c = financeiroCategoriasCache.find(x => String(getField(x,['ID','id'])) === String(id));
      return c ? getField(c,['NOME','nome'],'-') : '-';
    }

    function formaNome(id) {
      const f = financeiroFormasCache.find(x => String(getField(x,['ID','id'])) === String(id));
      return f ? getField(f,['NOME','nome','DESCRICAO','descricao'],'-') : '-';
    }

    function despesasDoPeriodo(inicio, fim) {
      return financeiroDespesasCache.filter(d => {
        const dt = localDateKey(dataDespesa(d));
        if (!dt) return false;
        if (inicio && dt < inicio) return false;
        if (fim && dt > fim) return false;
        return true;
      });
    }

    function renderFinanceiroModule() {
      const container = document.getElementById('moduleContent');
      container.innerHTML = '<div class="module-panel"><div class="module-toolbar"><div><h2>💰 Financeiro</h2><p style="color:var(--cinza);margin-top:6px;">Controle as despesas da KUKI e acompanhe os resultados.</p></div><div class="actions-inline"><button class="secondary-button" onclick="renderFinanceiroModule()">↻ Atualizar</button><button class="primary-button" onclick="abrirFormDespesa()">➕ Nova despesa</button></div></div><div id="financeiroBody"><div class="empty-state"><div class="empty-state-icon">💰</div><strong>Carregando financeiro...</strong></div></div></div>';
      carregarFinanceiroDados().then(renderFinanceiroBody).catch(error => {
        console.error('Financeiro:', error);
        document.getElementById('financeiroBody').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><strong>Não foi possível carregar o financeiro.</strong><p style="margin-top:8px;">'+escapeHtml(error.message || 'Erro desconhecido')+'</p></div>';
      });
    }

    function renderFinanceiroBody() {
      const body = document.getElementById('financeiroBody');
      if (!body) return;
      const hoje = dataHojeISO();
      const inicioMes = hoje.slice(0,7) + '-01';
      const hojeDespesas = despesasDoPeriodo(hoje,hoje).reduce((s,d)=>s+valorDespesa(d),0);
      const mesDespesas = despesasDoPeriodo(inicioMes,hoje).reduce((s,d)=>s+valorDespesa(d),0);
      const inicio = document.getElementById('finInicio')?.value || inicioMes;
      const fim = document.getElementById('finFim')?.value || hoje;
      const lista = despesasDoPeriodo(inicio,fim);
      const totalPeriodo = lista.reduce((s,d)=>s+valorDespesa(d),0);

      body.innerHTML = `
        <div class="financeiro-grid">
          <div class="financeiro-card negativo"><div class="label">💸 DESPESAS HOJE</div><div class="value">${formatMoney(hojeDespesas)}</div><div class="hint">${hoje}</div></div>
          <div class="financeiro-card negativo"><div class="label">📅 DESPESAS DO MÊS</div><div class="value">${formatMoney(mesDespesas)}</div><div class="hint">Do dia 1 até hoje</div></div>
          <div class="financeiro-card"><div class="label">📊 TOTAL DO PERÍODO</div><div class="value">${formatMoney(totalPeriodo)}</div><div class="hint">${lista.length} lançamento(s)</div></div>
        </div>
        <div class="financeiro-filtros">
          <div class="field"><label>Data inicial</label><input type="date" id="finInicio" value="${inicio}"></div>
          <div class="field"><label>Data final</label><input type="date" id="finFim" value="${fim}"></div>
          <button class="secondary-button" onclick="renderFinanceiroBody()">🔎 Filtrar</button>
        </div>
        <div class="table-wrap">
          <table class="financeiro-tabela">
            <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Pagamento</th><th>Valor</th><th>Ações</th></tr></thead>
            <tbody>${lista.length ? lista.map(d => {
              const id = getField(d,['ID','id']);
              return `<tr>
                <td>${formatDateTime(dataDespesa(d)).split(',')[0]}</td>
                <td>${escapeHtml(getField(d,['DESCRICAO','descricao'],'-'))}</td>
                <td>${escapeHtml(getField(d,['CATEGORIA','categoria'],'-'))}</td>
                <td>${escapeHtml(getField(d,['FORMA_PAGAMENTO','forma_pagamento'],'-'))}</td>
                <td><strong>${formatMoney(valorDespesa(d))}</strong></td>
                <td><div class="actions-inline"><button type="button" class="secondary-button btn-editar-despesa" data-despesa-id="${escapeHtml(String(id))}">✏️ Editar</button><button type="button" class="danger-button btn-excluir-despesa" data-despesa-id="${escapeHtml(String(id))}">🗑️ Excluir</button></div></td>
              </tr>`;
            }).join('') : '<tr><td colspan="6">Nenhuma despesa encontrada no período.</td></tr>'}</tbody>
          </table>
        </div>`;

      // Eventos adicionados após renderizar a tabela para evitar problemas com onclick inline.
      body.querySelectorAll('.btn-editar-despesa').forEach(botao => {
        botao.addEventListener('click', () => {
          const id = botao.dataset.despesaId;
          if (id === undefined || id === null || id === '') {
            showToast('Erro ao editar', 'Não foi possível identificar a despesa selecionada.');
            return;
          }
          abrirFormDespesa(id);
        });
      });
      body.querySelectorAll('.btn-excluir-despesa').forEach(botao => {
        botao.addEventListener('click', () => excluirDespesa(botao.dataset.despesaId));
      });
    }

    function abrirFormDespesa(id=null) {
      const atual = id == null ? null : financeiroDespesasCache.find(d => String(getField(d,['ID','id'])) === String(id));
      if (id != null && !atual) {
        showToast('Despesa não encontrada', 'Atualize a tela e tente editar novamente.');
        return;
      }
      const titulo = atual ? '✏️ Editar despesa' : '➕ Nova despesa';
      const categoriaOptions = financeiroCategoriasCache.map(c => { const nome = getField(c,['NOME','nome']); return `<option value="${escapeHtml(String(nome || ''))}" ${atual && String(getField(atual,['CATEGORIA','categoria'],'')).trim()===String(nome || '').trim()?'selected':''}>${escapeHtml(nome || '')}</option>`; }).join('');
      const formaOptions = financeiroFormasCache.map(f => {
        const fn=getField(f,['NOME','nome','DESCRICAO','descricao']);
        return `<option value="${escapeHtml(String(fn || ''))}" ${atual && String(getField(atual,['FORMA_PAGAMENTO','forma_pagamento'],'')).trim()===String(fn || '').trim()?'selected':''}>${escapeHtml(fn || '')}</option>`;
      }).join('');
      const dataAtual = atual ? localDateKey(dataDespesa(atual)) : dataHojeISO();
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'modalDespesa';
      // Trava visual e funcional: clicar fora do popup não fecha a edição.
      modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;';
      modal.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-label="${titulo}" style="background:#fff;max-width:640px;width:100%;max-height:92vh;overflow:auto;border-radius:18px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.35);">
        <div class="modal-header"><h2>${titulo}</h2><button type="button" class="icon-button" id="fecharModalDespesaBtn">✕</button></div>
        <form id="formDespesa">
          <div class="field"><label>Data</label><input type="date" id="despesaData" value="${dataAtual}" required></div>
          <div class="field"><label>Descrição</label><input type="text" id="despesaDescricao" value="${escapeHtml(atual?getField(atual,['DESCRICAO','descricao'],''):'')}" placeholder="Ex.: Compra de chocolate" required></div>
          <div class="field"><label>Categoria</label><select id="despesaCategoria"><option value="">Selecione</option>${categoriaOptions}</select></div>
          <div class="field"><label>Forma de pagamento</label><select id="despesaForma"><option value="">Selecione</option>${formaOptions}</select></div>
          <div class="field"><label>Valor</label><input type="number" step="0.01" min="0.01" id="despesaValor" value="${atual?valorDespesa(atual):''}" placeholder="0,00" required></div>
          <div class="field"><label>Observação</label><textarea id="despesaObs" placeholder="Observações opcionais">${escapeHtml(atual?getField(atual,['OBSERVACAO','observacao'],''):'')}</textarea></div>
          <div class="actions-inline" style="justify-content:flex-end;margin-top:18px"><button type="button" class="secondary-button" id="cancelarDespesaBtn">Cancelar</button><button type="submit" class="primary-button">💾 Confirmar</button></div>
        </form>
      </div>`;
      const modalStyle = document.createElement('style');
      modalStyle.id = 'modalDespesaStyle';
      modalStyle.textContent = `
        #modalDespesa, #modalDespesa * { box-sizing:border-box !important; }
        #modalDespesa .modal-card { color:#30343b !important; font-family:inherit !important; }
        #modalDespesa .modal-header { display:flex !important; align-items:center !important; justify-content:space-between !important; gap:16px !important; margin-bottom:20px !important; }
        #modalDespesa .modal-header h2 { margin:0 !important; font-size:26px !important; line-height:1.2 !important; }
        #modalDespesa .icon-button { width:42px !important; height:42px !important; min-width:42px !important; border:0 !important; border-radius:10px !important; cursor:pointer !important; font-size:20px !important; background:#f1ece7 !important; color:#8c0b1f !important; }
        #modalDespesa .field { display:flex !important; flex-direction:column !important; gap:7px !important; width:100% !important; margin:0 0 16px !important; }
        #modalDespesa .field label { display:block !important; width:100% !important; font-weight:700 !important; font-size:15px !important; }
        #modalDespesa .field input, #modalDespesa .field select, #modalDespesa .field textarea { display:block !important; width:100% !important; min-width:0 !important; min-height:52px !important; padding:12px 14px !important; border:1px solid #d8d0c8 !important; border-radius:12px !important; font:inherit !important; font-size:16px !important; background:#fff !important; color:#30343b !important; }
        #modalDespesa .field textarea { min-height:92px !important; resize:vertical !important; }
        #modalDespesa .actions-inline { display:flex !important; flex-wrap:wrap !important; gap:10px !important; align-items:center !important; }
        #modalDespesa button { min-height:44px !important; padding:10px 18px !important; }
        @media (max-width:700px) { #modalDespesa { padding:8px !important; align-items:flex-start !important; overflow:auto !important; } #modalDespesa .modal-card { margin:8px 0 !important; max-height:none !important; min-height:calc(100vh - 16px) !important; padding:18px !important; } #modalDespesa .modal-header h2 { font-size:22px !important; } }
      `;
      document.head.appendChild(modalStyle);
      document.body.appendChild(modal);

      // Impede que clique fora, inclusive eventos propagados, feche o modal.
      modal.addEventListener('click', event => {
        if (event.target === modal) { event.preventDefault(); event.stopPropagation(); }
      });
      modal.addEventListener('mousedown', event => {
        if (event.target === modal) { event.preventDefault(); event.stopPropagation(); }
      });
      const formDespesa = modal.querySelector('#formDespesa');
      const solicitarFechamento = () => {
        if (confirm('Cancelar esta edição? As alterações não salvas serão perdidas.')) fecharModalDespesa(true);
      };
      modal.querySelector('#cancelarDespesaBtn').addEventListener('click', solicitarFechamento);
      modal.querySelector('#fecharModalDespesaBtn').addEventListener('click', solicitarFechamento);
      modal.addEventListener('keydown', event => {
        if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); }
      });
      formDespesa.addEventListener('submit', async function(event) {
        event.preventDefault();
        const botao = formDespesa.querySelector('button[type="submit"]');
        if (botao) { botao.disabled = true; botao.dataset.originalText = botao.textContent; botao.textContent = 'Salvando...'; }
        try {
          await salvarDespesa(id);
        } finally {
          if (botao && document.body.contains(botao)) { botao.disabled = false; botao.textContent = botao.dataset.originalText || '💾 Confirmar'; }
        }
      });
      // Foco inicial na descrição para facilitar a edição.
      setTimeout(() => modal.querySelector('#despesaDescricao')?.focus(), 0);
    }

    function fecharModalDespesa(forcar=false){
      const modal = document.getElementById('modalDespesa');
      if (modal) modal.remove();
      document.getElementById('modalDespesaStyle')?.remove();
    }

    async function salvarDespesa(id) {
      const data = document.getElementById('despesaData').value;
      const descricao = document.getElementById('despesaDescricao').value.trim();
      const categoria = document.getElementById('despesaCategoria').value || null;
      const forma = document.getElementById('despesaForma').value || null;
      const valor = Number(document.getElementById('despesaValor').value);
      const observacao = document.getElementById('despesaObs').value.trim() || null;
      if (!data || !descricao || !(valor > 0)) { showToast('Dados obrigatórios','Informe data, descrição e valor válido.'); return; }
      if (!confirm(id ? 'Confirmar alteração desta despesa?' : 'Confirmar inclusão desta despesa?')) return;
      // Não envia ATIVO porque a tabela FINANCEIRO_DESPESAS atual não possui essa coluna.
      const payload = {
        DATA: data+'T12:00:00',
        DESCRICAO: descricao,
        CATEGORIA: categoria || null,
        FORMA_PAGAMENTO: forma || null,
        VALOR: valor,
        OBSERVACAO: observacao
      };
      try {
        if (id == null) {
          await restRequest('FINANCEIRO_DESPESAS', '', {
            method:'POST',
            headers:{'Prefer':'return=representation'},
            body: JSON.stringify(payload)
          });
        } else {
          await restRequest('FINANCEIRO_DESPESAS', '?id=eq.'+encodeURIComponent(id), {
            method:'PATCH',
            headers:{'Prefer':'return=representation'},
            body: JSON.stringify(payload)
          });
        }
        fecharModalDespesa();
        showToast('Financeiro atualizado', id == null ? 'Despesa cadastrada com sucesso.' : 'Despesa alterada com sucesso.');
        await renderFinanceiroModule();
      } catch(e) {
        console.error('Erro ao salvar despesa:', e);
        showToast('Erro ao salvar', e.message || 'Não foi possível salvar a despesa.');
        throw e;
      }
    }

    function editarDespesa(id){ abrirFormDespesa(id); }

    async function excluirDespesa(id) {
      if (!confirm('Excluir esta despesa? Esta ação não poderá ser desfeita.')) return;
      try {
        await restRequest('FINANCEIRO_DESPESAS', '?ID=eq.'+encodeURIComponent(id), {method:'DELETE'});
        showToast('Despesa excluída','O lançamento foi removido.');
        renderFinanceiroModule();
      } catch(e) { console.error(e); showToast('Erro ao excluir', e.message || 'Não foi possível excluir a despesa.'); }
    }


    /* =====================================================
       MENU
    ====================================================== */
    function selectMenu(button, name) {
      document.querySelectorAll('.menu button').forEach(item => item.classList.remove('active'));
      button.classList.add('active'); abrirModulo(name);
    }
    function selectMenuByName(name) {
      document.querySelectorAll('.menu button').forEach(botao => {
        if (botao.textContent.replace(/\s+/g,' ').trim().includes(name)) selectMenu(botao,name);
      });
    }
    function carregarModuloAtual() { abrirModulo(moduloAtual); }
    function abrirModulo(name) {
      moduloAtual = name;
      const dashboard = document.getElementById('dashboardContent');
      const moduleContent = document.getElementById('moduleContent');
      document.getElementById('pageTitle').textContent = name;
      const subtitles = {
        'Dashboard':'Visão geral da sua loja','Pedidos':'Acompanhe e gerencie todos os pedidos','Produtos':'Cadastre e gerencie os produtos da KUKI','Clientes':'Consulte os clientes cadastrados','Formas de pagamento':'Gerencie as opções de pagamento','Formas de entrega':'Gerencie as formas de entrega','Horários':'Defina os horários de funcionamento da loja','Configurações':'Configurações gerais do sistema','Financeiro':'Controle de despesas e acompanhamento financeiro'
      };
      document.getElementById('pageSubtitle').textContent = subtitles[name] || '';
      if (name === 'Dashboard') { dashboard.style.display='block'; moduleContent.style.display='none'; atualizarDashboard(); return; }
      dashboard.style.display='none'; moduleContent.style.display='block';
      if (name === 'Horários') renderHorariosModule();
      else if (name === 'Financeiro') renderFinanceiroModule();
      else if (name === 'Pedidos') renderPedidosModule();
      else if (CRUD_TABLES[name]) renderCrudModule(name);
      else renderPlaceholderModule(name);
    }

    /* =====================================================
       INICIAR
    ====================================================== */
    // Nesta versão o login está temporariamente desativado.
    abrirSistema({ email: 'admin@kuki.local' });

  </script>

</body>
