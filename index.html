<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KUKI Gerencial</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --vermelho: #a9001d;
      --vermelho-escuro: #820016;
      --vermelho-claro: #c31231;
      --creme: #f8eee4;
      --creme-escuro: #ead7c4;
      --branco: #ffffff;
      --texto: #352c2c;
      --cinza: #777777;
      --borda: #e8ddd3;
      --fundo: #f7f3ef;
      --verde: #1f9d55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background:
        radial-gradient(circle at top left, #f9e7d6, transparent 35%),
        linear-gradient(135deg, #fff8f2, #ead8c8);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.97);
      border-radius: 28px;
      padding: 42px;
      box-shadow: 0 20px 60px rgba(80, 30, 30, 0.16);
      border: 1px solid var(--borda);
    }

    .login-logo {
      display: block;
      width: 210px;
      max-width: 100%;
      margin: 0 auto 10px;
    }

    .login-title {
      text-align: center;
      color: var(--vermelho);
      font-size: 30px;
      font-weight: 800;
      margin-top: 5px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--cinza);
      margin: 10px 0 30px;
      font-size: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--texto);
    }

    .field input {
      width: 100%;
      height: 52px;
      border-radius: 13px;
      border: 1px solid var(--borda);
      padding: 0 16px;
      font-size: 16px;
      outline: none;
      background: #fff;
      transition: 0.2s;
    }

    .field input:focus {
      border-color: var(--vermelho);
      box-shadow: 0 0 0 3px rgba(169, 0, 29, 0.1);
    }

    .login-button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 13px;
      background: var(--vermelho);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    .login-button:hover {
      background: var(--vermelho-escuro);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      display: none;
      margin-top: 18px;
      background: #fff0f1;
      border: 1px solid #f3c4ca;
      color: #a9001d;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
    }

    /* =========================
       SISTEMA
    ========================= */

    #appScreen {
      display: block;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      width: 260px;
      height: 100vh;
      left: 0;
      top: 0;
      background: var(--vermelho);
      color: white;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 3px 0 20px rgba(0,0,0,0.08);
    }

    .sidebar-logo {
      padding: 10px 15px 28px;
      text-align: center;
    }

    .sidebar-logo img {
      width: 160px;
      max-width: 100%;
      background: #fff8f2;
      border-radius: 14px;
      padding: 8px;
    }

    .sidebar-title {
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 8px;
      opacity: 0.85;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .menu button {
      width: 100%;
      border: none;
      background: transparent;
      color: white;
      text-align: left;
      padding: 14px 15px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s;
    }

    .menu button:hover,
    .menu button.active {
      background: rgba(255,255,255,0.18);
    }

    .menu button span {
      display: inline-block;
      width: 30px;
      font-size: 19px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 20px;
    }

    .user-info {
      padding: 12px 14px;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .user-label {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 5px;
    }

    .user-email {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-button {
      width: 100%;
      border: none;
      background: rgba(0,0,0,0.18);
      color: white;
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .logout-button:hover {
      background: rgba(0,0,0,0.28);
    }

    /* =========================
       CONTEÚDO
    ========================= */

    .main {
      margin-left: 260px;
      min-height: 100vh;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
    }

    .page-title h1 {
      font-size: 30px;
      color: var(--vermelho);
      margin-bottom: 5px;
    }

    .page-title p {
      color: var(--cinza);
      font-size: 14px;
    }

    .date-box {
      background: white;
      border: 1px solid var(--borda);
      padding: 12px 17px;
      border-radius: 12px;
      font-size: 13px;
      color: var(--cinza);
    }

    .dashboard {
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      border: 1px solid var(--borda);
      box-shadow: 0 5px 18px rgba(50, 30, 20, 0.04);
    }

    .card-icon {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--creme);
      font-size: 22px;
      margin-bottom: 15px;
    }

    .card-label {
      font-size: 13px;
      color: var(--cinza);
      font-weight: 600;
    }

    .card-value {
      font-size: 29px;
      font-weight: 800;
      color: var(--texto);
      margin-top: 5px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
    }

    .panel {
      background: white;
      border: 1px solid var(--borda);
      border-radius: 18px;
      padding: 24px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .panel h2 {
      font-size: 19px;
      color: var(--texto);
    }

    .panel-link {
      border: none;
      background: none;
      color: var(--vermelho);
      cursor: pointer;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: var(--cinza);
    }

    .empty-state-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .welcome {
      background:
        linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
      color: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .welcome p {
      opacity: 0.88;
      font-size: 14px;
      line-height: 1.5;
    }

    .mobile-header {
      display: none;
    }
    .mobile-back-button { display:none; }
    .mobile-header-title { display:none; }




    /* =========================
       BEM-VINDO / NOTIFICAÇÕES / MÓDULOS
    ========================= */

    .notification-button {
      border: 1px solid var(--borda);
      background: white;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      cursor: pointer;
      position: relative;
      font-size: 20px;
    }
    .notification-badge {
      position:absolute; right:-5px; top:-5px;
      min-width:20px; height:20px; padding:0 5px;
      border-radius:20px; background:var(--vermelho); color:#fff;
      font-size:11px; font-weight:800; display:none;
      align-items:center; justify-content:center;
      border:2px solid #fff;
    }
    .topbar-actions { display:flex; align-items:center; gap:12px; }

    .toast-container {
      position:fixed; right:24px; top:24px; z-index:5000;
      display:flex; flex-direction:column; gap:10px; max-width:360px;
    }
    .toast {
      background:#fff; border:1px solid var(--borda); border-left:5px solid var(--vermelho);
      border-radius:14px; padding:14px 16px; box-shadow:0 14px 35px rgba(50,20,20,.18);
      animation:slideIn .25s ease;
    }
    .toast strong { display:block; color:var(--vermelho); margin-bottom:4px; }
    .toast p { color:var(--texto); font-size:13px; }
    @keyframes slideIn { from {opacity:0; transform:translateX(30px)} to {opacity:1; transform:none} }

    .module-panel { background:#fff; border:1px solid var(--borda); border-radius:18px; padding:24px; }
    .module-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .primary-button { border:none; background:var(--vermelho); color:#fff; padding:11px 16px; border-radius:10px; font-weight:800; cursor:pointer; }
    .primary-button:hover { background:var(--vermelho-escuro); }
    .table-wrap { overflow-x:auto; }
    .data-table { width:100%; border-collapse:collapse; min-width:680px; }
    .data-table th, .data-table td { padding:13px 12px; border-bottom:1px solid var(--borda); text-align:left; font-size:14px; }
    .data-table th { color:var(--cinza); font-size:12px; text-transform:uppercase; letter-spacing:.3px; }
    .time-input { border:1px solid var(--borda); border-radius:9px; padding:8px; color:var(--texto); }
    .switch { position:relative; display:inline-block; width:48px; height:26px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background:#bbb; border-radius:30px; cursor:pointer; transition:.2s; }
    .slider:before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
    .switch input:checked + .slider { background:var(--verde); }
    .switch input:checked + .slider:before { transform:translateX(22px); }
    .status-pill { display:inline-block; padding:5px 9px; border-radius:20px; background:var(--creme); color:var(--texto); font-size:12px; font-weight:700; }
    .recent-orders-list { display:grid; gap:10px; }
    .recent-order { display:flex; justify-content:space-between; gap:12px; padding:13px; border:1px solid var(--borda); border-radius:12px; }
    .recent-order strong { display:block; margin-bottom:4px; }
    .recent-order small { color:var(--cinza); }
    .empty-module { text-align:center; padding:50px 20px; color:var(--cinza); }


    .crud-form-box{margin:20px 0;padding:18px;border:1px solid #ead7c7;border-radius:16px;background:#fffaf6}.crud-form-box h3{margin-bottom:14px}.crud-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-weight:700}.crud-field input{padding:12px;border:1px solid #d9c8bb;border-radius:10px;font:inherit}.check-field{flex-direction:row;align-items:center}.crud-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.secondary-button,.danger-button{padding:10px 14px;border-radius:9px;border:1px solid #d8c4b5;background:#fff;cursor:pointer;font-weight:700}.danger-button{color:#a20c23;border-color:#e3b5be}

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .welcome-top { display:block; padding:22px; }
      .welcome-top h1 { font-size:22px; }
      .welcome-top .topbar-actions { margin-top:18px; justify-content:space-between; }

      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
        padding: 20px 15px;
      }

      .mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--vermelho);
        padding: 13px 15px;
        border-radius: 15px;
        margin-bottom: 20px;
      }

      .mobile-header img {
        width: 110px;
        background: #fff8f2;
        padding: 5px;
        border-radius: 8px;
      }

      .mobile-header button {
        border: none;
        background: rgba(255,255,255,0.16);
        color: white;
        padding: 9px 12px;
        border-radius: 8px;
        font-weight: 700;
      }

      .topbar {
        display: block;
      }

      .topbar-actions { margin-top:15px; justify-content:space-between; }
      .toast-container { right:12px; left:12px; top:12px; max-width:none; }

      .date-box {
        margin-top: 15px;
        display: inline-block;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .card {
        padding: 16px;
      }

      .card-value {
        font-size: 23px;
      }

      .login-card {
        padding: 30px 22px;
      }

      .login-title {
        font-size: 26px;
      }
    }

    @media (max-width: 430px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 15px;
      }
    }
      .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.form-grid label{display:flex;flex-direction:column;gap:7px;font-weight:600}.form-grid input{padding:11px;border:1px solid var(--borda);border-radius:9px}.danger-button{padding:9px 12px;border:none;border-radius:8px;background:#b42318;color:#fff;cursor:pointer;margin-left:5px}@media(max-width:760px){.data-table{font-size:12px}.data-table th,.data-table td{padding:9px 6px}.form-grid{grid-template-columns:1fr}}

    /* CONFIRMAÇÃO E AÇÕES */
    .actions-inline{display:flex;gap:8px;align-items:center;justify-content:flex-start;white-space:nowrap}
    .actions-inline button{margin:0!important;min-width:92px}
    .crud-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .crud-actions button{margin:0!important;min-width:120px}
    .confirm-overlay{position:fixed;inset:0;background:rgba(30,20,20,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:99999}
    .confirm-overlay.show{display:flex}
    .confirm-dialog{width:min(100%,420px);background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--borda)}
    .confirm-dialog h3{font-size:22px;margin-bottom:10px;color:var(--texto)}
    .confirm-dialog p{color:var(--cinza);line-height:1.5;margin-bottom:22px}
    .confirm-buttons{display:flex;gap:10px;justify-content:flex-end}
    .confirm-buttons button{margin:0!important;min-width:110px}
    @media(max-width:600px){.actions-inline{flex-direction:column;align-items:stretch}.actions-inline button{width:100%}.confirm-buttons{flex-direction:column-reverse}.confirm-buttons button{width:100%}}

  </style>
</head>

<body>

  <!-- =========================
       SISTEMA
  ========================== -->

  <section id="appScreen">

    <!-- MENU LATERAL -->

    <aside class="sidebar">

      <nav class="menu">

        <button class="active" onclick="selectMenu(this, 'Dashboard')">
          <span>📊</span> Dashboard
        </button>

        <button onclick="selectMenu(this, 'Pedidos')">
          <span>📦</span> Pedidos
        </button>

        <button onclick="selectMenu(this, 'Produtos')">
          <span>🍪</span> Produtos
        </button>

        <button onclick="selectMenu(this, 'Clientes')">
          <span>👥</span> Clientes
        </button>

        <button onclick="selectMenu(this, 'Formas de pagamento')">
          <span>💳</span> Pagamentos
        </button>

        <button onclick="selectMenu(this, 'Formas de entrega')">
          <span>🛵</span> Entregas
        </button>

        <button onclick="selectMenu(this, 'Horários')">
          <span>🕐</span> Horários
        </button>

        <button onclick="selectMenu(this, 'Configurações')">
          <span>⚙️</span> Configurações
        </button>

      </nav>

      <div class="sidebar-bottom">

        <div class="user-info">
          <div class="user-label">USUÁRIO LOGADO</div>
          <div class="user-email" id="userName">
            Usuário
          </div>
        </div>

        <button
          class="logout-button"
          onclick="logout()"
        >
          🚪 SAIR
        </button>

      </div>

    </aside>


    <!-- CONTEÚDO -->

    <main class="main">

      <div class="mobile-header">
        <button class="mobile-back-button" id="mobileBackButton" type="button" onclick="voltarTelaAnterior()" aria-label="Voltar">← Voltar</button>
        <div class="mobile-header-title">KUKI Gerencial</div>
        <button onclick="logout()">SAIR</button>
      </div>


      <div class="topbar" id="topbar">

        <div class="welcome-top">
          <div>
            <h1 id="pageTitle">Bem-vindo ao KUKI Gerencial! 💰</h1>
            <p id="pageSubtitle">Tenha uma visão completa da sua loja e gerencie tudo em um só lugar.</p>
          </div>

          <div class="topbar-actions">
            <div class="date-box" id="currentDate"></div>
            <button class="notification-button" type="button" onclick="marcarNotificacoesLidas()" title="Novos pedidos">🔔<span class="notification-badge" id="notificationBadge">0</span></button>
          </div>
        </div>

      </div>


      <!-- DASHBOARD -->

      <div id="dashboardContent">


        <div class="cards">

          <div class="card card-clickable" onclick="abrirDashboardModulo('Pedidos')" title="Ver pedidos de hoje">
            <div class="card-icon">📦</div>
            <div class="card-label">PEDIDOS HOJE</div>
            <div class="card-value" id="pedidosHoje">0</div>
          </div>

          <div class="card card-clickable" onclick="abrirDashboardModulo('Pedidos')" title="Ver pedidos novos">
            <div class="card-icon">🔔</div>
            <div class="card-label">PEDIDOS NOVOS</div>
            <div class="card-value" id="pedidosNovos">0</div>
          </div>

        </div>


        <div class="content-grid">

          <div class="panel">

            <div class="panel-header">
              <h2>Pedidos recentes</h2>

              <button
                class="panel-link"
                onclick="selectMenuByName('Pedidos')"
              >
                Ver todos
              </button>
            </div>

            <div id="recentOrders" class="recent-orders-list">
              <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <strong>Carregando pedidos...</strong>
              </div>
            </div>

          </div>


          <div class="panel">

            <div class="panel-header">
              <h2>Acesso rápido</h2>
            </div>

            <div style="display:grid; gap:12px;">

              <button
                onclick="selectMenuByName('Pedidos')"
                style="
                  padding:15px;
                  border:1px solid #e8ddd3;
                  background:#fff;
                  border-radius:12px;
                  cursor:pointer;
                  text-align:left;
                  font-weight:bold;
                "
              >
                📦 Gerenciar pedidos
              </button>

              <button
                onclick="selectMenuByName('Produtos')"
                style="
                  padding:15px;
                  border:1px solid #e8ddd3;
                  background:#fff;
                  border-radius:12px;
                  cursor:pointer;
                  text-align:left;
                  font-weight:bold;
                "
              >
                🍪 Gerenciar produtos
              </button>

              <button
                onclick="abrirDashboardModulo('Pedidos')"
                style="
                  padding:15px;
                  border:1px solid #e8ddd3;
                  background:#fff;
                  border-radius:12px;
                  cursor:pointer;
                  text-align:left;
                  font-weight:bold;
                "
              >
                💰 Ver faturamento
              </button>

              <button
                onclick="abrirDashboardModulo('Clientes')"
                style="
                  padding:15px;
                  border:1px solid #e8ddd3;
                  background:#fff;
                  border-radius:12px;
                  cursor:pointer;
                  text-align:left;
                  font-weight:bold;
                "
              >
                👥 Gerenciar clientes
              </button>

              <button
                onclick="selectMenuByName('Horários')"
                style="
                  padding:15px;
                  border:1px solid #e8ddd3;
                  background:#fff;
                  border-radius:12px;
                  cursor:pointer;
                  text-align:left;
                  font-weight:bold;
                "
              >
                🕐 Alterar horários
              </button>

            </div>

          </div>

        </div>

      </div>


      <!-- ÁREA DE OUTROS MÓDULOS -->
      <div id="moduleContent" style="display:none;"></div>
    </main>

  </section>


  <div class="toast-container" id="toastContainer"></div>


  <div id="confirmOverlay" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-dialog">
      <h3 id="confirmTitle">Confirmar ação</h3>
      <p id="confirmMessage">Deseja continuar?</p>

    async function restRequest(table, path='', options={}) {
      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      const url = SUPABASE_URL + '/rest/v1/' + encodeURIComponent(table) + path;
      const response = await fetch(url, {...options, headers});
      const text = await response.text();
      let body = null;
      try { body = text ? JSON.parse(text) : null; } catch(e) { body = text; }
      if (!response.ok) {
        const message = body && body.message ? body.message : (body && body.hint ? body.hint : text || 'Erro ao consultar dados.');
        throw new Error(message);
      }
      return body;
    }

    async function carregarCrud(name){
      const cfg=CRUD_TABLES[name]; if(!cfg) return [];
      try { const rows=await restRequest(cfg.table,'?select=*&order=id.asc'); crudCache[name]=Array.isArray(rows)?rows:[]; return crudCache[name]; }
      catch(e){ try { const rows=await restRequest(cfg.table.toLowerCase(),'?select=*'); crudCache[name]=Array.isArray(rows)?rows:[]; return crudCache[name]; } catch(e2){ console.error(e,e2); crudCache[name]=[]; throw e2; } }
    }
    function crudFields(name, rows){
      const cfg=CRUD_TABLES[name]; const set=new Set(cfg.fields);
      (rows||[]).forEach(r=>Object.keys(r||{}).forEach(k=>{ if(!isSystemField(k)) set.add(k); }));

    async function confirmarAcao(titulo, mensagem, textoConfirmar='Confirmar'){

    async function salvarCrud(e,name){
      e.preventDefault(); const cfg=CRUD_TABLES[name],form=e.currentTarget,body=collectCrudForm(form),idx=form.dataset.editIndex; const editing=idx!=='';
      const ok=await confirmarAcao(editing?'Confirmar alteração':'Confirmar inclusão',editing?'Deseja realmente salvar as alterações deste cadastro?':'Deseja realmente incluir este novo cadastro?',editing?'Salvar alterações':'Inserir cadastro'); if(!ok)return;
      try{if(editing){const old=crudCache[name][Number(idx)];const id=getRecordId(old);if(id===null||id===undefined)throw new Error('Registro sem ID');await restRequest(cfg.table,'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});}else{await restRequest(cfg.table,'',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});}showToast('Sucesso',editing?'Alterações salvas com sucesso.':'Cadastro incluído com sucesso.');await renderCrudModule(name);}catch(err){console.error(err);alert('Não foi possível salvar. '+(err.message||''));}}
    async function excluirCrud(name,index){const old=(crudCache[name]||[])[Number(index)],id=getRecordId(old);if(id===null||id===undefined){alert('Não foi possível identificar o registro.');return;}const ok=await confirmarAcao('Confirmar exclusão','Deseja realmente excluir este cadastro? Esta ação não poderá ser desfeita.','Excluir');if(!ok)return;const cfg=CRUD_TABLES[name];try{await restRequest(cfg.table,'?id=eq.'+encodeURIComponent(id),{method:'DELETE'});showToast('Excluído','Registro removido com sucesso.');await renderCrudModule(name);}catch(err){console.error(err);alert('Não foi possível excluir. '+(err.message||''));}}

    document.getElementById('moduleContent').addEventListener('click',function(e){const b=e.target.closest('[data-crud-action]');if(!b)return;const action=b.dataset.crudAction,name=b.dataset.crudName,index=Number(b.dataset.crudIndex);if(action==='new')abrirFormularioCrud(name);else if(action==='refresh')renderCrudModule(name);else if(action==='edit')editarCrud(name,index);else if(action==='delete')excluirCrud(name,index);else if(action==='cancel')fecharFormularioCrud();});

    function renderPlaceholderModule(name) {
      const icons = {'Produtos':'🍪','Clientes':'👥','Formas de pagamento':'💳','Formas de entrega':'🛵','Configurações':'⚙️'};
      document.getElementById('moduleContent').innerHTML = '<div class="module-panel empty-module"><div class="empty-state-icon">'+(icons[name]||'⚙️')+'</div><h2>'+escapeHtml(name)+'</h2><p style="margin-top:10px;">Este módulo será conectado ao Supabase na próxima etapa.</p></div>';
    }

    /* =====================================================
       ACESSO TEMPORARIAMENTE SEM LOGIN
    ====================================================== */
    async function abrirSistemaSemLogin() {
      appScreen.style.display = 'block';
      const nome = document.getElementById('userName');
      if (nome) nome.textContent = 'KUKI Gerencial';
      await pedirPermissaoNotificacao();
      history.replaceState({kukiGerencial:true, modulo:'Dashboard'}, '', '#dashboard');
      abrirModulo('Dashboard', false);
      await Promise.all([carregarPedidos(true), carregarClientes()]);
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = setInterval(() => carregarPedidos(false), 10000);
    }

    function logout() {
      if (confirm('Deseja sair da tela atual?')) {
        abrirModulo('Dashboard', false);
        window.scrollTo({top:0, behavior:'smooth'});
      }
    }

    /* =====================================================
       MENU
    ====================================================== */
    function atualizarBotaoVoltar() {
      const btn = document.getElementById('mobileBackButton');
      if (btn) btn.classList.toggle('visible', moduloAtual !== 'Dashboard');
    }

    function voltarTelaAnterior() {
      if (moduloAtual !== 'Dashboard') {
        abrirModulo('Dashboard', false);
        if (window.history.state && window.history.state.kukiGerencial) history.replaceState({kukiGerencial:true, modulo:'Dashboard'}, '', '#dashboard');
      }
    }

    function selectMenu(button, name) {
      document.querySelectorAll('.menu button').forEach(item => item.classList.remove('active'));
      button.classList.add('active'); abrirModulo(name, true);
    }
    function abrirDashboardModulo(name) {
      selectMenuByName(name);
    }

    function selectMenuByName(name) {
      document.querySelectorAll('.menu button').forEach(botao => {
        if (botao.textContent.replace(/\s+/g,' ').trim().includes(name)) selectMenu(botao,name);
      });
    }
    function carregarModuloAtual() { abrirModulo(moduloAtual); }
    function abrirModulo(name, registrarHistorico=false) {
      moduloAtual = name;
      if (registrarHistorico) {
        history.pushState({kukiGerencial:true, modulo:name}, '', '#' + encodeURIComponent(name.toLowerCase().replace(/\s+/g,'-')));
      }
      atualizarBotaoVoltar();
      const dashboard = document.getElementById('dashboardContent');
      const moduleContent = document.getElementById('moduleContent');
      document.getElementById('pageTitle').textContent = name === 'Dashboard' ? 'Bem-vindo ao KUKI Gerencial! 💰' : name;
      const subtitles = {
        'Dashboard':'Tenha uma visão completa da sua loja e gerencie tudo em um só lugar.','Pedidos':'Acompanhe e gerencie todos os pedidos','Produtos':'Cadastre e gerencie os produtos da KUKI','Clientes':'Consulte os clientes cadastrados','Formas de pagamento':'Gerencie as opções de pagamento','Formas de entrega':'Gerencie as formas de entrega','Horários':'Defina os horários de funcionamento da loja','Configurações':'Configurações gerais do sistema'
      };
      document.getElementById('pageSubtitle').textContent = subtitles[name] || '';
      if (name === 'Dashboard') { dashboard.style.display='block'; moduleContent.style.display='none'; atualizarDashboard(); return; }
      dashboard.style.display='none'; moduleContent.style.display='block';
      if (name === 'Horários') renderHorariosModule();
      else if (name === 'Pedidos') renderPedidosModule();
      else if (CRUD_TABLES[name]) renderCrudModule(name);
      else renderPlaceholderModule(name);
    }


    window.addEventListener('popstate', function(event) {
      const modulo = event.state && event.state.kukiGerencial ? event.state.modulo : 'Dashboard';
      abrirModulo(modulo || 'Dashboard', false);
    });

    /* =====================================================
       INICIAR
    ====================================================== */
    abrirSistemaSemLogin();

  </script>

</body>
</html>
